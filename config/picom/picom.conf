# --- Configuración Base (God Edition) ---
backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# --- Animaciones (Si tu versión de Picom los soporta) ---
animations = true;
animation-stiffness = 300;
animation-window-mass = 1;
animation-dampening = 25;
animation-clamping = true;
animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";
animation-for-transient-window = "slide-up";

# --- Transiciones Suaves (Fading) ---
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# --- Blur (Efecto cristal moderno) ---
blur: {
  method = "dual_kawase";
  strength = 7;
  background = true;
  background-frame = false;
  background-fixed = false;
};

# --- Bordes Redondeados ---
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# --- Reglas de Opacidad ---
opacity-rule = [
  "95:class_g = 'Thunar' && focused",
  "85:class_g = 'Thunar' && !focused",
  "95:class_g = 'Rofi'",
  "100:class_g = 'Polybar'"
];

# --- Otros ---
log-level = "warn";
wintypes: {
  normal = { fade = true; shadow = true; }
  tooltip = { fade = true; shadow = false; opacity = 0.9; focus = true; full-shadow = false; };
  dock = { shadow = false; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.95; }
  dropdown_menu = { opacity = 0.95; }
};
